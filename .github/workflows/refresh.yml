name: Refresh and deploy

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: upstream-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: https://upstream.thanh-tran-794.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip # CPU inference only: do not download the CUDA binaries
      - name: Restore the embedding model (about 100 MB, used by the headline classifier)
        id: embedcache
        uses: actions/cache/restore@v4
        with:
          path: .cache/models
          key: embed-model-multilingual-e5-small-q8
      - name: Restore saved history
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/history.json
            .cache/label-pool.json
          key: history-none
          restore-keys: history-
      - name: Build fresh data (continues from the saved history)
        run: node pipeline/run.mjs
        env:
          HISTORY_URL: ${{ env.SITE_URL }}/data/history.json
      - name: Save history
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/history.json
            .cache/label-pool.json
          key: history-${{ github.run_id }}
      - name: Save the embedding model (only when it downloaded)
        if: ${{ steps.embedcache.outputs.cache-hit != 'true' && hashFiles('.cache/models/**/*.onnx') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/models
          key: embed-model-multilingual-e5-small-q8
      - name: Deploy to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler deploy
      - name: Skip note
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "CLOUDFLARE_API_TOKEN secret not set; data built but not deployed."
